name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, name: windows-x64, cc: cl,    cxx: cl }
          - { os: ubuntu-latest,   name: linux-x64,   cc: gcc,   cxx: g++ }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSDL_SHARED=OFF -DSDL_STATIC=ON
          -DSDL_INSTALL=OFF
          -DSDL_X11_XTEST=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test (must pass for a release)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage and archive
        shell: bash
        run: |
          cmake --install build --config Release --prefix stage
          NAME="qgb-${{ github.ref_name }}-${{ matrix.name }}"
          cpack --config build/CPackConfig.cmake -C Release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: qgb-*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
