name: ci

on:
  push:
    branches: ["master"]
    tags: ["v*"]          # tags trigger the same workflow
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64,   cc: cl,    cxx: cl,      package: true  }
          - { os: ubuntu-latest,  name: linux-x64,     cc: gcc,   cxx: g++,     package: true  }
          - { os: ubuntu-latest,  name: linux-clang,   cc: clang, cxx: clang++, package: true }

    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install SDL dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_INSTALL=OFF
          -DSDL_X11_XTEST=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure --output-junit junit-report.xml

      - name: Publish Test Results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: CTest JUnit Report (${{ matrix.name }})
          path: build/junit-report.xml
          reporter: java-junit
          fail-on-error: true

      # ---- release-only steps ----
      - name: Package
        if: env.IS_RELEASE == 'true' && matrix.package
        run: cpack --config build/CPackConfig.cmake -C Release -B dist

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE == 'true' && matrix.package
        with:
          name: ${{ matrix.name }}
          path: dist/qgb-*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true