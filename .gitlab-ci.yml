  script:
    - cmake -B build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DSDL_X11_XTEST=OFF -S .
    - cmake --build build --config Release
    - ctest --test-dir build -C Release --output-on-failure --output-junit junit-report.xml
  artifacts:
    when: always
    reports:
