stages:
  - build

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# 1. Linux with GCC
build_ubuntu_gcc:
  stage: build
  image: ubuntu:latest
  tags:
    - saas-linux-medium-amd64
  before_script:
    - apt-get update && apt-get install -y build-essential cmake ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev libasound2-dev libpulse-dev libudev-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev
  script:
    - cmake -B build -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DSDL_X11_XTEST=OFF -S .
    - cmake --build build --config Release
    - ctest --test-dir build -C Release --output-on-failure --output-junit junit-report.xml
  artifacts:
    when: always
    reports:
      junit: build/junit-report.xml

# 2. Linux with Clang
build_ubuntu_clang:
  stage: build
  image: ubuntu:latest
