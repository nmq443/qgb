# 3. Windows with MSVC
build_windows_msvc:
  stage: build
  tags:
    - saas-windows-medium-amd64
  script:
    - cmake -B build -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=Release -DSDL_X11_XTEST=OFF -S .
    - cmake --build build --config Release
    - ctest --test-dir build -C Release --output-on-failure --output-junit junit-report.xml
  artifacts:
    when: always
    reports:
      junit: build/junit-report.xml
